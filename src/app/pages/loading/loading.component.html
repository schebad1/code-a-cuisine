<app-header-primary></app-header-primary>

<main class="loading">
  <div class="loading__container" role="status" aria-live="polite">
    <div class="loading__visual" aria-hidden="true">
      <img
        src="assets/loading/loading-animation.gif"
        alt="Loading animation"
        class="loading__gif"
      />
    </div>
    <span class="loading__text">
      Generating
      <span class="loading__dots" aria-hidden="true">
        <span class="loading__dot" style="--i: 0"></span>
        <span class="loading__dot" style="--i: 1"></span>
        <span class="loading__dot" style="--i: 2"></span>
      </span>
    </span>
  </div>
</main>
